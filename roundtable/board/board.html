<title>설교 원탁회의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 위에 회의 이름, 가운데 정사각 무대(원탁 + 다섯 자리), 아래에 진행 막대와 버튼 */
:root {
  --bg: #eef1f4;
  --ink: #1d2733;
  --muted: #5d6b7a;
  --table: #6b4a33;
  --table-rim: #4d3424;
  --bubble: #ffffff;
  --line: #cfd6de;
  --focus: #2f6fb0;
  --display: "Gowun Batang", "Nanum Myeongjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a21; --ink: #e6ebf0; --muted: #98a6b5; --table: #5a3f2c; --table-rim: #3b2a1e;
    --bubble: #232c36; --line: #34404d; --focus: #79aee6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a21; --ink: #e6ebf0; --muted: #98a6b5; --table: #5a3f2c; --table-rim: #3b2a1e;
  --bubble: #232c36; --line: #34404d; --focus: #79aee6; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 24px; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-direction: column; gap: 2px; }
header h1 { font-family: var(--display); font-size: 1.35rem; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: .9rem; }

.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.stage:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 12px; }
.table { position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--table) 80%, #fff 20%), var(--table) 60%); box-shadow: inset 0 0 0 6px var(--table-rim); }
.table span { position: absolute; inset: 0; display: grid; place-items: center; color: #f3e7da; font-family: var(--display); font-size: clamp(.8rem, 3.2vw, 1rem); text-align: center; padding: 18%; }

.seat { position: absolute; width: 22%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .25s ease, opacity .25s ease; opacity: .55; }
.seat.on { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
.disc { width: 62%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: clamp(.8rem, 3.4vw, 1.05rem); box-shadow: 0 0 0 3px var(--bg); }
.seat.on .disc { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--ring, var(--focus)); }
.seat b { font-size: clamp(.7rem, 2.9vw, .85rem); }
.tag { font-size: clamp(.62rem, 2.5vw, .74rem); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; white-space: nowrap; background: var(--bg); }

.bubble { position: absolute; width: 64%; max-height: 40%; overflow-y: auto; background: var(--bubble); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: clamp(.78rem, 3.3vw, .92rem); line-height: 1.55; box-shadow: 0 6px 18px rgb(0 0 0 / .12); transform: translate(-50%, -50%); animation: pop .22s ease; z-index: 2; }
.bubble .who { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .78em; color: var(--muted); margin-bottom: 4px; }
.bubble .who strong { color: var(--ink); }
.stance { border-radius: 999px; padding: 0 7px; border: 1px solid currentColor; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -46%); } }
@media (prefers-reduced-motion: reduce) { .bubble { animation: none; } .seat { transition: none; } }

.controls { display: flex; align-items: center; gap: 10px; }
.controls button { font: inherit; border: 1px solid var(--line); background: var(--bubble); color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.controls button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); flex: 1; }
.controls button:disabled { opacity: .4; cursor: default; }
.controls button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.progress { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; min-width: 4.5em; text-align: center; }

.result { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.result h2 { font-family: var(--display); font-size: 1.05rem; margin: 0; }
.result ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; line-height: 1.55; }
.result p { margin: 0; line-height: 1.6; }
.hint { color: var(--muted); font-size: .8rem; text-align: center; margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1 id="title">설교 원탁회의</h1>
    <p id="sub"></p>
  </header>
  <div class="stage" id="stage" tabindex="0" role="button" aria-label="다음 장면">
    <div class="table"><span id="center">원탁</span></div>
  </div>
  <div class="controls">
    <button id="prev" type="button">이전</button>
    <button id="next" type="button" class="primary">다음</button>
    <span class="progress" id="progress"></span>
  </div>
  <p class="hint">원탁을 누르거나 다음 버튼을 누르면 한 장면씩 넘어갑니다.</p>
  <section class="result" id="result" hidden>
    <h2>세 줄 요약</h2>
    <ol id="summary"></ol>
    <h2>종합 결론</h2>
    <p id="conclusion"></p>
  </section>
</div>

<script>
const M = /*MEETING*/null;
// 다섯 자리: 맨 위에서 시계 방향으로 정오각형.
const POS = [0, 1, 2, 3, 4].map((i) => {
  const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
  return { x: 50 + 39 * Math.cos(a), y: 50 + 39 * Math.sin(a), a };
});
const stage = document.getElementById('stage');
let i = 0;

document.getElementById('title').textContent = M.title;
document.getElementById('sub').textContent = `「${M.sermon}」`;

const seatEls = {};
M.seats.forEach((s, k) => {
  const el = document.createElement('div');
  el.className = 'seat';
  el.style.left = POS[k].x + '%';
  el.style.top = POS[k].y + '%';
  el.style.setProperty('--ring', s.color);
  el.innerHTML = `<div class="disc" style="background:${s.color}">${s.short}</div><b></b><span class="tag"></span>`;
  el.querySelector('b').textContent = s.name;
  el.querySelector('.tag').textContent = s.role;
  stage.appendChild(el);
  seatEls[s.id] = { el, k, seat: s };
});

let bubble = null;
function render() {
  const step = M.steps[i];
  for (const id in seatEls) seatEls[id].el.classList.toggle('on', id === step.seat);
  bubble?.remove();
  const { k, seat } = seatEls[step.seat];
  // 말풍선은 말하는 자리와 원탁 중심 사이, 원탁 쪽으로 붙인다.
  const p = POS[k];
  const bx = 50 + 6 * Math.cos(p.a), by = 50 + 10 * Math.sin(p.a);
  bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.style.left = Math.min(Math.max(bx, 34), 66) + '%';
  bubble.style.top = by + '%';
  const extra = step.vote ? `${step.vote} 투표` : step.stance || '';
  bubble.innerHTML = `<div class="who"><strong></strong><span class="tag"></span>${extra ? '<span class="stance"></span>' : ''}</div><div class="say"></div>`;
  bubble.querySelector('strong').textContent = seat.name;
  bubble.querySelector('.who .tag').textContent = seat.role;
  if (extra) bubble.querySelector('.stance').textContent = extra;
  bubble.querySelector('.say').textContent = step.text;
  stage.appendChild(bubble);

  document.getElementById('center').textContent = step.label;
  document.getElementById('progress').textContent = `${i + 1} / ${M.steps.length}`;
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').textContent = i === M.steps.length - 1 ? '처음부터' : '다음';
  document.getElementById('result').hidden = !step.final;
}
function go(d) { i = (i + d + M.steps.length) % M.steps.length; render(); }
stage.addEventListener('click', () => go(1));
stage.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(1); } });
document.getElementById('next').addEventListener('click', () => go(1));
document.getElementById('prev').addEventListener('click', () => go(-1));

const ol = document.getElementById('summary');
M.summary.forEach((l) => { const li = document.createElement('li'); li.textContent = l; ol.appendChild(li); });
const tail = M.outcome.vote ? ` (투표 ${M.outcome.vote})` : M.outcome.result !== '해당 없음' ? ` (${M.outcome.result})` : '';
document.getElementById('conclusion').textContent = M.conclusion + tail;
render();
</script>
